<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Runnable Code Blocks · Browser adapter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="rcb-site">
    <main class="rcb-site__main">
      <header class="rcb-site__hero">
        <p class="rcb-site__eyebrow">STATIC BROWSER ADAPTER</p>
        <h1>Runnable Code Blocks</h1>
        <p>같은 <code>run-&lt;language&gt;</code> Markdown 문법을 로컬 Obsidian과 정적 웹에서 사용합니다.</p>
        <section class="rcb-site__support" aria-labelledby="supported-languages-title">
          <div>
            <p class="rcb-site__support-label">SUPPORTED LANGUAGES · <span data-supported-language-count></span></p>
            <h2 id="supported-languages-title">현재 지원되는 모든 언어</h2>
          </div>
          <ul class="rcb-site__languages" data-supported-languages></ul>
        </section>
      </header>

      <section aria-label="All language runtime tests" data-language-test-cases></section>
    </main>
    <script>
      (() => {
        const html = (parent, tag, options, callback) => {
          const owner = parent.nodeType === Node.DOCUMENT_NODE ? parent : parent.ownerDocument;
          const element = owner.createElement(tag);
          const info = typeof options === "string" ? { cls: options } : options ?? {};
          if (info.cls) element.className = Array.isArray(info.cls) ? info.cls.join(" ") : info.cls;
          if (info.text !== undefined) element.textContent = info.text;
          parent.append(element);
          callback?.(element);
          return element;
        };
        Node.prototype.createEl = function (tag, options, callback) {
          return html(this, tag, options, callback);
        };
        Node.prototype.createDiv = function (options, callback) {
          return html(this, "div", options, callback);
        };
        Node.prototype.createSpan = function (options, callback) {
          return html(this, "span", options, callback);
        };
        Node.prototype.createSvg = function (tag, options, callback) {
          const owner = this.nodeType === Node.DOCUMENT_NODE ? this : this.ownerDocument;
          const element = owner.createElementNS("http://www.w3.org/2000/svg", tag);
          const info = typeof options === "string" ? { cls: options } : options ?? {};
          if (info.cls) element.setAttribute("class", Array.isArray(info.cls) ? info.cls.join(" ") : info.cls);
          this.append(element);
          callback?.(element);
          return element;
        };
        window.rcbFetch = window.fetch.bind(window);
      })();
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
